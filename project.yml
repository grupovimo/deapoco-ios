# El proyecto de Xcode sale de acá: `xcodegen generate` (el .xcodeproj no se versiona).
name: DeAPoco
options:
  bundleIdPrefix: ar.com.deapoco
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  DeAPoco:
    type: application
    platform: iOS
    sources:
      - path: DeAPoco
        excludes: [Recursos/PrivacyInfo.xcprivacy]
      # El manifiesto de privacidad (lo pide App Store Connect): como recurso, explícito.
      - path: DeAPoco/Recursos/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.deapoco.app
        PRODUCT_NAME: DeAPoco
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          # TestFlight por GitHub Actions con firma manual.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.deapoco.app App Store
    info:
      path: DeAPoco/Info.plist
      properties:
        CFBundleDisplayName: De a Poco
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Fraunces.ttf
          - HankenGrotesk.ttf
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Lanzamiento
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # La barra de estado la elige cada pantalla (clara sobre la banda enlozada, oscura sobre manteca).
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        NSCameraUsageDescription: Para sacarle una foto a tu comida y mandársela a tu nutri.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [whatsapp]
  DeAPocoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DeAPocoTests]
    dependencies:
      - target: DeAPoco
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DeAPoco:
    build:
      targets:
        DeAPoco: all
        DeAPocoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DeAPocoTests]
